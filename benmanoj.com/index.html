<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben Manoj - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Instrument Serif', serif;
            background-color: #F5F5DC;
            color: #5C4D3C;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem 3rem;
            display: flex;
            justify-content: flex-end;
        }

        .header-name {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .content {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.25rem;
            font-style: italic;
            opacity: 0.8;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            header {
                padding: 1.5rem 2rem;
            }

            .header-name {
                font-size: 1.25rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 1rem 1.5rem;
            }

            .header-name {
                font-size: 1.1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-name">Ben Manoj</div>
    </header>
    
    <main>
        <div class="content">
            <h1>Coming Soon</h1>
            <p class="subtitle">Something beautiful is in the works.</p>
        </div>
    </main>
</body>
</html>
